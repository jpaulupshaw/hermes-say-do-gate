name: say-do-gate
version: 0.1.0
requires_hermes: ">=0.22.6"
description: "Checks agent claims against what actually ran this turn. Deterministic, zero tokens."
provides_hooks:
  - post_tool_call
  - pre_llm_call
  - transform_llm_output
config_schema:
  mode:
    type: str
    default: observe
    description: "observe (keeps streaming, nudges next turn) or annotate (holds the reply, appends a receipt footer)"
